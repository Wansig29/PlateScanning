name: Build and release Windows app

# Run manually: Actions tab -> "Build and release Windows app" -> Run workflow.
# Also runs when you push a tag like v1.0.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Download plate models (bundled so the app works offline)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/fetch_models.py

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build PlateScanner.exe
        shell: pwsh
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build platescanner.spec

      - name: Zip the build
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Compress-Archive -Path dist\PlateScanner -DestinationPath "PlateScanner-$tag-win64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PSAU Gate Plate Scanner ${{ env.TAG }}
          files: PlateScanner-${{ env.TAG }}-win64.zip
          body: |
            Windows 64-bit build. No Python needed.
            1. Download the ZIP below and extract the whole folder.
            2. Run `PlateScanner.exe`.
            3. Edit `camera.source` in `%LOCALAPPDATA%\PlateScanner\config.json` for your camera.
