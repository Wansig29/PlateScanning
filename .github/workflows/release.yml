name: Build and release Windows app

# Run manually: Actions tab -> "Build and release Windows app" -> Run workflow.
# Also runs when you push a tag like v1.0.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Work out the version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stamp the version into the app (so the in-app update check knows what it is running)
        shell: pwsh
        run: |
          (Get-Content platescanner\__init__.py) -replace '__version__ = ".*"', "__version__ = `"$env:VERSION`"" | Set-Content platescanner\__init__.py
          Get-Content platescanner\__init__.py

      - name: Download plate models (bundled so the app works offline)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/fetch_models.py

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build PlateScanner.exe
        shell: pwsh
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build platescanner.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build the one-click installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed (exit code $LASTEXITCODE)" }

      - name: Zip the portable build
        shell: pwsh
        run: Compress-Archive -Path dist\PlateScanner -DestinationPath "PlateScanner-$env:TAG-portable-win64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PSAU Gate Plate Scanner ${{ env.TAG }}
          files: |
            installer_output/PlateScanner-Setup.exe
            PlateScanner-${{ env.TAG }}-portable-win64.zip
          body: |
            Windows 64-bit. No Python needed.

            **Install:** download `PlateScanner-Setup.exe`, double-click it and follow the steps.
            A Desktop shortcut is created. If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.

            Portable option: the `portable` ZIP can be extracted anywhere and run directly (`PlateScanner.exe`).

            After installing, edit `camera.source` in `%LOCALAPPDATA%\PlateScanner\config.json` for your camera.
